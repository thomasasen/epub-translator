name: Bootstrap and EPUB audit tests
on:
  push:
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n bootstrap.sh
      - name: ShellCheck
        run: shellcheck -S warning bootstrap.sh
      - name: Compile audit
        run: python3 -m py_compile audit_epub.py
      - name: Synthetic EPUB audit tests
        run: python3 -m unittest discover -s tests -v
