name: Bootstrap, EPUB and audiobook tests
on:
  push:
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and ShellCheck
        run: |
          bash -n bootstrap.sh
          shellcheck -S warning bootstrap.sh
      - name: Compile Python
        run: python3 -m compileall -q audit_epub.py audiobook scripts tests
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Install web API test dependencies
        run: python3 -m pip install --user --break-system-packages fastapi==0.115.12 python-multipart==0.0.20 httpx==0.28.1
      - name: Check frontend JavaScript syntax
        run: |
          python3 -c 'from pathlib import Path; t=Path("audiobook/ui.html").read_text(); Path("/tmp/audiobook-ui.js").write_text(t.split("<script>")[1].split("</script>")[0])'
          node --check /tmp/audiobook-ui.js
      - name: Verify native Qwen integration against pinned TBL version
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/hydropix/TranslateBooksWithLLMs/0cc31bc7f4aeedfcb3fe904eeaebd15d6fa0ad1f/src/web/static/js/index.js -o /tmp/tbl-native-index.js
          python3 scripts/patch_tbl_tts.py /tmp/tbl-native-index.js --check
          python3 scripts/patch_tbl_tts.py /tmp/tbl-native-index.js
          python3 scripts/patch_tbl_tts.py /tmp/tbl-native-index.js
          cp /tmp/tbl-native-index.js /tmp/tbl-native-index.mjs
          cp audiobook/tbl-bridge.js /tmp/tbl-bridge.mjs
          node --check /tmp/tbl-native-index.mjs
          node --check /tmp/tbl-bridge.mjs
      - name: Validate the German Thorsten reference API and audio download
        run: |
          AUDIOBOOK_VOICE_CACHE="$(mktemp -d)" python3 - <<'PY'
          from audiobook.german_reference import ensure_thorsten_reference
          from audiobook.engine import inspect_wav
          path, transcript = ensure_thorsten_reference()
          assert len(transcript) >= 70
          assert 3 <= inspect_wav(path)["seconds"] <= 20
          print("Real CC0 German reference downloaded and decoded successfully.")
          PY
      - name: Unit and mocked integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Nginx reverse-proxy integration
        run: bash tests/test_nginx_auth.sh
